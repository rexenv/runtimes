name: Build PHP 8.x (with pdo_pgsql)

# Manual only, like every build here: these artifacts are pinned by hash in
# rexenv's source, so a build that fired on push would produce releases nobody
# asked for and tempt someone into re-uploading over a tag — the one thing this
# repo exists to prevent.
#
# What it is for: static-php.dev's bulk builds carry `pgsql` and NO `pdo_pgsql`,
# while their PDO advertises `pgsql` anyway — so a PDO connection is accepted and
# then stalls until the server times it out. Laravel's pgsql driver IS PDO. See
# the header of scripts/build-php.sh for the measurement, and RELEASE-NOTES-php-8x.md
# for what a consumer needs to know.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: "PHP versions to build, comma-separated (exact patches, e.g. 8.3.33,8.4.23)."
        required: true
        default: "8.3.33"
      build_number:
        description: "Build number. NEVER reuse one — a rebuild is the next number, not a re-upload."
        required: true
        default: "1"
      publish:
        description: "Publish a release. Off = build + run the gates only (use this first)."
        type: boolean
        default: false
      prebuilt:
        description: "Use spc's pre-built dependency archives. Off = build every dep from source (much slower; use to rule them out as a failure cause)."
        type: boolean
        default: true

permissions:
  contents: write      # create the release
  id-token: write      # sigstore, for build provenance
  attestations: write

jobs:
  # The version list is an input, and a matrix needs JSON. One tiny job so the
  # build matrix stays declarative rather than every job re-parsing the string.
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.split.outputs.versions }}
    steps:
      - id: split
        env:
          RAW: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          # Exact patch versions only. "8.3" would resolve to whatever spc calls
          # latest on the day the job runs, and these bytes get pinned by hash in
          # another repository — a build whose version is decided at run time is
          # a pin nobody chose.
          JSON="["
          SEP=""
          for v in ${RAW//,/ }; do
            case "$v" in
              8.[0-9].[0-9]|8.[0-9].[0-9][0-9]) ;;
              *) echo "::error::not an exact 8.x patch version: $v"; exit 1 ;;
            esac
            JSON="$JSON$SEP\"$v\""
            SEP=","
          done
          JSON="$JSON]"
          [ "$JSON" = "[]" ] && { echo "::error::no versions given"; exit 1; }
          echo "versions=$JSON" >> "$GITHUB_OUTPUT"
          echo "building: $JSON"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.versions) }}
        arch: [aarch64, x86_64]
        # `include` here only ATTACHES the runner to an existing combination —
        # it matches on `arch`, so this stays a version × arch cross product.
        # (An include entry that named a key the matrix does not have would ADD
        # jobs instead, which is how a matrix silently builds one arch of
        # everything and both arches of nothing.)
        include:
          - { arch: aarch64, runner: macos-15 }
          - { arch: x86_64,  runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      # NO setup-php step, deliberately. The released `spc` binary is itself a
      # static PHP — `./spc --version` and `./spc doctor` both run with no `php`
      # on PATH at all (verified 9 Sep 2026 under `env -i`) — so the host PHP was
      # never needed here, only inherited from the 7.4 workflow.
      #
      # It was not free: on macos-15-intel, `shivammathur/setup-php` spent
      # 24 minutes and then failed with "Could not setup PHP 8.4", which killed
      # the x86_64 half of this build's first run while the arm64 half went
      # green (run 34335791126). A dependency that buys nothing can still cost
      # you half a matrix.

      # spc's --prefer-pre-built asks api.github.com which pre-built dep archives
      # exist; unauthenticated that is 60 req/hr PER IP, shared across the runner
      # fleet, so it 403s intermittently and the build dies before compiling
      # anything. The job's own token lifts it to 1000/hr.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build-php.sh "${{ matrix.version }}" "${{ matrix.arch }}" "$GITHUB_WORKSPACE/out" "${{ inputs.prebuilt }}"

      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ matrix.version }}-${{ matrix.arch }}
          path: out/
          retention-days: 7

      # A failed build's config.log is the only thing that says WHY, and the
      # runner deletes the workspace with it.
      - name: Keep the failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-${{ matrix.version }}-${{ matrix.arch }}
          path: out/debug/
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [plan, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with: { path: staged }

      # The immutability contract is a repo SETTING, and a setting nobody checks
      # is exactly the promise it was meant to replace. Three states, not two:
      # "the API did not tell me" is NOT "it is off".
      - name: Assert immutable releases are enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="$(gh api repos/${{ github.repository }} -q '.immutable_releases' 2>/dev/null || echo)"
          case "$STATE" in
            true)  echo "immutable releases: ON (reported by the API)" ;;
            false)
              echo "::error::immutable releases are OFF — a published pin could be silently replaced."
              exit 1 ;;
            *)
              echo "::error::the API does not report immutable_releases for this repo, so this gate"
              echo "::error::cannot confirm the setting. CHECK IT BY HAND before publishing, then"
              echo "::error::re-run with IMMUTABLE_ACK=confirmed set as a repository variable."
              [ "${{ vars.IMMUTABLE_ACK }}" = "confirmed" ] || exit 1
              echo "immutable releases: acknowledged by hand (vars.IMMUTABLE_ACK)" ;;
          esac

      # A tag is never reused. If it exists, this build is asking to overwrite
      # bytes somebody has already pinned.
      - name: Assert the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="php-8x-${{ inputs.build_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. A rebuild is the NEXT build number, never a re-upload."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The one flag that could quietly undo everything above: it lets a release
      # asset be replaced in place, which is the property this repo exists to deny.
      - name: Assert no release asset can be replaced in place
        run: |
          PAT="gh +release +(upload|create|edit)\b[^|]*--clobber"
          if grep -rnE "$PAT" .github/ scripts/ | grep -v 'GUARD-PROBE'; then
            echo "::error::a release command would overwrite an existing asset — forbidden here"
            exit 1
          fi
          printf 'gh release upload "$T" out/* --clobber\n' > /tmp/spc-clobber-probe # GUARD-PROBE
          grep -qE "$PAT" /tmp/spc-clobber-probe \
            || { echo "::error::the guard no longer detects its own hazard"; exit 1; }
          rm -f /tmp/spc-clobber-probe
          echo "no release command overwrites an asset (and the guard is proven live)"

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          find staged -type f \( -name '*.tar.gz' -o -name 'SHA256SUMS-*' \) -exec cp -n {} out/ \;
          cd out
          shasum -a 256 ./*.tar.gz | tee SHA256SUMS
          for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -lh

      # Both arches of both kinds, for every version asked for — a publish that
      # is missing one is a half-release somebody will pin anyway.
      - name: Assert the set is complete
        run: |
          set -euo pipefail
          VERSIONS='${{ needs.plan.outputs.versions }}'
          for v in $(echo "$VERSIONS" | tr -d '[]"' | tr ',' ' '); do
            for kind in cli fpm; do
              for arch in aarch64 x86_64; do
                f="out/php-$v-$kind-macos-$arch.tar.gz"
                [ -f "$f" ] || { echo "::error::missing $f — refusing to publish a partial set"; exit 1; }
              done
            done
          done
          echo "every version × {cli,fpm} × {aarch64,x86_64} is present"

      # What actually proves origin. The .sha256 files are documentation; the
      # hash pinned in rexenv's source is the trust root; this is the receipt
      # saying which workflow, commit and tag produced these bytes.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "out/*.tar.gz"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* \
            --title "PHP 8.x with pdo_pgsql (build ${{ inputs.build_number }})" \
            --notes-file RELEASE-NOTES-php-8x.md
